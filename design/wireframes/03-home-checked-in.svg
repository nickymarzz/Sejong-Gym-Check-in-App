<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- screen background -->
    <rect width="390" height="844" fill="#F5F6F8"/>

    <!-- status bar -->
    <text x="28" y="28" font-size="13" font-weight="600" fill="#3A4149">9:41</text>
    <rect x="301" y="17" width="3" height="6" rx="1" fill="#3A4149"/>
    <rect x="306" y="15" width="3" height="8" rx="1" fill="#3A4149"/>
    <rect x="311" y="13" width="3" height="10" rx="1" fill="#3A4149"/>
    <rect x="316" y="11" width="3" height="12" rx="1" fill="#3A4149"/>
    <path d="M330 17a10 10 0 0 1 14 0" stroke="#3A4149" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="337" cy="22" r="1.8" fill="#3A4149"/>
    <rect x="352" y="13" width="22" height="11" rx="3" stroke="#3A4149" stroke-width="1.5" fill="none"/>
    <rect x="354" y="15" width="14" height="7" rx="1.5" fill="#3A4149"/>
    <rect x="375" y="16" width="2" height="5" rx="1" fill="#3A4149"/>

    <!-- ===== app header ===== -->
    <rect x="0" y="0" width="390" height="111" fill="#FFFFFF"/>
    <line x1="0" y1="111" x2="390" y2="111" stroke="#D8DCE3"/>
    <rect x="16" y="59" width="40" height="40" rx="12" fill="#C9CED6"/>
    <rect x="20" y="76" width="32" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="15" y="71" width="7" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="50" y="71" width="7" height="16" rx="2" fill="#FFFFFF"/>
    <text x="68" y="76" font-size="20" font-weight="800" fill="#3A4149">SGC</text>
    <text x="68" y="92" font-size="11" font-weight="500" fill="#B4BAC2">Sejong Gym Check-in</text>
    <!-- status badge: In Gym -->
    <rect x="259" y="65" width="71" height="25" rx="12.5" fill="#E4E7EC" stroke="#C9CED6"/>
    <circle cx="269" cy="77.5" r="3.5" fill="#6B7280"/>
    <text x="282" y="82" font-size="11" font-weight="700" fill="#6B7280">In Gym</text>
    <!-- logout -->
    <rect x="340" y="62" width="34" height="34" rx="17" fill="#FFFFFF" stroke="#D8DCE3"/>
    <rect x="350" y="71" width="8" height="16" rx="2" stroke="#8A919B" stroke-width="1.5" fill="none"/>
    <line x1="352" y1="79" x2="361" y2="79" stroke="#8A919B" stroke-width="2"/>
    <path d="M358 76l3 3-3 3" stroke="#8A919B" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ===== welcome ===== -->
    <text x="16" y="144" font-size="22" font-weight="800" fill="#3A4149">Welcome back, Demo</text>
    <text x="16" y="168" font-size="14" font-weight="500" fill="#8A919B">Ready for your workout at Student Union Gym?</text>

    <!-- ===== capacity card ===== -->
    <rect x="16" y="198" width="358" height="272" rx="18" fill="#FFFFFF" stroke="#D8DCE3"/>
    <text x="40" y="232" font-size="12" font-weight="700" fill="#8A919B" letter-spacing="0.5">CURRENT GYM CAPACITY</text>
    <rect x="296" y="223" width="54" height="25" rx="12.5" fill="#E4E7EC" stroke="#D8DCE3"/>
    <text x="323" y="240" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle">Open</text>
    <text x="138" y="308" font-size="48" font-weight="800" fill="#3A4149">25</text>
    <text x="198" y="303" font-size="32" font-weight="700" fill="#B4BAC2">/</text>
    <text x="216" y="303" font-size="32" font-weight="700" fill="#8A919B">50</text>
    <text x="195" y="333" font-size="15" font-weight="600" fill="#8A919B" text-anchor="middle">50% occupied</text>
    <rect x="40" y="360" width="310" height="10" rx="5" fill="#D8DCE3"/>
    <rect x="40" y="360" width="155" height="10" rx="5" fill="#8A919B"/>
    <rect x="40" y="390" width="149" height="56" rx="12" fill="#F0F1F4"/>
    <text x="52" y="411" font-size="11" font-weight="600" fill="#B4BAC2" letter-spacing="0.4">HOURS</text>
    <text x="52" y="430" font-size="14" font-weight="700" fill="#3A4149">06:00 — 22:00</text>
    <rect x="201" y="390" width="149" height="56" rx="12" fill="#F0F1F4"/>
    <text x="213" y="411" font-size="11" font-weight="600" fill="#B4BAC2" letter-spacing="0.4">AVAILABLE</text>
    <text x="213" y="430" font-size="14" font-weight="700" fill="#3A4149">25 spots</text>

    <!-- ===== user status card (checked in) ===== -->
    <rect x="16" y="490" width="358" height="179" rx="18" fill="#FFFFFF" stroke="#D8DCE3"/>
    <text x="40" y="524" font-size="12" font-weight="700" fill="#8A919B" letter-spacing="0.5">YOUR CHECK-IN STATUS</text>
    <rect x="40" y="533" width="310" height="112" rx="12" fill="#E4E7EC" stroke="#C9CED6" stroke-width="2"/>
    <circle cx="88" cy="589" r="28" fill="#FFFFFF"/>
    <circle cx="88" cy="589" r="13" stroke="#6B7280" stroke-width="2" fill="none"/>
    <path d="M82 589l4 4 8-9" stroke="#6B7280" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="583" font-size="20" font-weight="800" fill="#6B7280">Checked In</text>
    <text x="132" y="605" font-size="14" font-weight="600" fill="#6B7280">Since Nov 9, 6:30 AM</text>

    <!-- ===== primary action ===== -->
    <rect x="16" y="693" width="358" height="64" rx="18" fill="#6B7280"/>
    <text x="195" y="731" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">CHECK OUT</text>

    <!-- ===== bottom tab bar ===== -->
    <rect x="0" y="758" width="390" height="86" fill="#FFFFFF"/>
    <line x1="0" y1="758" x2="390" y2="758" stroke="#D8DCE3"/>
    <rect x="46" y="766" width="38" height="24" rx="10" fill="#E9EBEF"/>
    <path d="M56 782v-7l9-6 9 6v7z" fill="#6B7280"/>
    <text x="65" y="810" font-size="10.5" font-weight="800" fill="#6B7280" text-anchor="middle">Home</text>
    <circle cx="195" cy="777" r="9" stroke="#B4BAC2" stroke-width="2" fill="none"/>
    <line x1="195" y1="777" x2="195" y2="771" stroke="#B4BAC2" stroke-width="2" stroke-linecap="round"/>
    <text x="195" y="810" font-size="10.5" font-weight="500" fill="#B4BAC2" text-anchor="middle">History</text>
    <circle cx="325" cy="772" r="5" stroke="#B4BAC2" stroke-width="2" fill="none"/>
    <path d="M315 788c1-5 5-8 10-8s9 3 10 8" stroke="#B4BAC2" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="325" y="810" font-size="10.5" font-weight="500" fill="#B4BAC2" text-anchor="middle">Profile</text>
    <rect x="130" y="832" width="130" height="5" rx="2.5" fill="#C9CED6"/>
  </g>
</svg>
