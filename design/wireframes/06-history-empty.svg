<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- screen background -->
    <rect width="390" height="844" fill="#F5F6F8"/>

    <!-- status bar -->
    <text x="28" y="28" font-size="13" font-weight="600" fill="#3A4149">9:41</text>
    <rect x="301" y="17" width="3" height="6" rx="1" fill="#3A4149"/>
    <rect x="306" y="15" width="3" height="8" rx="1" fill="#3A4149"/>
    <rect x="311" y="13" width="3" height="10" rx="1" fill="#3A4149"/>
    <rect x="316" y="11" width="3" height="12" rx="1" fill="#3A4149"/>
    <path d="M330 17a10 10 0 0 1 14 0" stroke="#3A4149" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="337" cy="22" r="1.8" fill="#3A4149"/>
    <rect x="352" y="13" width="22" height="11" rx="3" stroke="#3A4149" stroke-width="1.5" fill="none"/>
    <rect x="354" y="15" width="14" height="7" rx="1.5" fill="#3A4149"/>
    <rect x="375" y="16" width="2" height="5" rx="1" fill="#3A4149"/>

    <!-- ===== app header ===== -->
    <rect x="0" y="0" width="390" height="111" fill="#FFFFFF"/>
    <line x1="0" y1="111" x2="390" y2="111" stroke="#D8DCE3"/>
    <rect x="16" y="59" width="40" height="40" rx="12" fill="#C9CED6"/>
    <rect x="20" y="76" width="32" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="15" y="71" width="7" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="50" y="71" width="7" height="16" rx="2" fill="#FFFFFF"/>
    <text x="68" y="76" font-size="20" font-weight="800" fill="#3A4149">History</text>
    <text x="68" y="92" font-size="11" font-weight="500" fill="#B4BAC2">Your sessions</text>
    <rect x="255" y="65" width="75" height="25" rx="12.5" fill="#F0F1F4" stroke="#D8DCE3"/>
    <circle cx="265" cy="77.5" r="3.5" fill="#B4BAC2"/>
    <text x="278" y="82" font-size="11" font-weight="700" fill="#6B7280">Outside</text>
    <rect x="340" y="62" width="34" height="34" rx="17" fill="#FFFFFF" stroke="#D8DCE3"/>
    <rect x="350" y="71" width="8" height="16" rx="2" stroke="#8A919B" stroke-width="1.5" fill="none"/>
    <line x1="352" y1="79" x2="361" y2="79" stroke="#8A919B" stroke-width="2"/>
    <path d="M358 76l3 3-3 3" stroke="#8A919B" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ===== list header ===== -->
    <text x="16" y="142" font-size="20" font-weight="800" fill="#3A4149">Check-in History</text>
    <text x="16" y="163" font-size="13" font-weight="500" fill="#B4BAC2">0 gym visits</text>

    <!-- ===== empty state ===== -->
    <rect x="181" y="255" width="28" height="34" rx="4" stroke="#B4BAC2" stroke-width="2.5" fill="none"/>
    <rect x="189" y="250" width="12" height="7" rx="3" fill="#B4BAC2"/>
    <circle cx="195" cy="272" r="7.5" stroke="#B4BAC2" stroke-width="2" fill="none"/>
    <line x1="195" y1="272" x2="195" y2="267" stroke="#B4BAC2" stroke-width="2" stroke-linecap="round"/>
    <line x1="195" y1="272" x2="199" y2="274" stroke="#B4BAC2" stroke-width="2" stroke-linecap="round"/>
    <text x="195" y="311" font-size="16" font-weight="800" fill="#8A919B" text-anchor="middle">No visits yet</text>
    <text x="195" y="333" font-size="13" font-weight="500" fill="#B4BAC2" text-anchor="middle">Check in at the gym to see</text>
    <text x="195" y="351" font-size="13" font-weight="500" fill="#B4BAC2" text-anchor="middle">your sessions here.</text>

    <!-- ===== bottom tab bar (History active) ===== -->
    <rect x="0" y="758" width="390" height="86" fill="#FFFFFF"/>
    <line x1="0" y1="758" x2="390" y2="758" stroke="#D8DCE3"/>
    <path d="M56 782v-7l9-6 9 6v7z" fill="#B4BAC2"/>
    <text x="65" y="810" font-size="10.5" font-weight="500" fill="#B4BAC2" text-anchor="middle">Home</text>
    <rect x="176" y="766" width="38" height="24" rx="10" fill="#E9EBEF"/>
    <circle cx="195" cy="777" r="9" stroke="#6B7280" stroke-width="2" fill="none"/>
    <line x1="195" y1="777" x2="195" y2="771" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
    <text x="195" y="810" font-size="10.5" font-weight="800" fill="#6B7280" text-anchor="middle">History</text>
    <circle cx="325" cy="772" r="5" stroke="#B4BAC2" stroke-width="2" fill="none"/>
    <path d="M315 788c1-5 5-8 10-8s9 3 10 8" stroke="#B4BAC2" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="325" y="810" font-size="10.5" font-weight="500" fill="#B4BAC2" text-anchor="middle">Profile</text>
    <rect x="130" y="832" width="130" height="5" rx="2.5" fill="#C9CED6"/>
  </g>
