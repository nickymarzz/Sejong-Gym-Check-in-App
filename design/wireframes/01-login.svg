<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- screen background -->
    <rect width="390" height="844" fill="#F5F6F8"/>

    <!-- status bar -->
    <text x="28" y="28" font-size="13" font-weight="600" fill="#3A4149">9:41</text>
    <rect x="301" y="17" width="3" height="6" rx="1" fill="#3A4149"/>
    <rect x="306" y="15" width="3" height="8" rx="1" fill="#3A4149"/>
    <rect x="311" y="13" width="3" height="10" rx="1" fill="#3A4149"/>
    <rect x="316" y="11" width="3" height="12" rx="1" fill="#3A4149"/>
    <path d="M330 17a10 10 0 0 1 14 0" stroke="#3A4149" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="337" cy="22" r="1.8" fill="#3A4149"/>
    <rect x="352" y="13" width="22" height="11" rx="3" stroke="#3A4149" stroke-width="1.5" fill="none"/>
    <rect x="354" y="15" width="14" height="7" rx="1.5" fill="#3A4149"/>
    <rect x="375" y="16" width="2" height="5" rx="1" fill="#3A4149"/>

    <!-- login card -->
    <rect x="16" y="226" width="358" height="439" rx="18" fill="#FFFFFF" stroke="#D8DCE3"/>

    <!-- logo -->
    <rect x="167" y="258" width="56" height="56" rx="16" fill="#C9CED6"/>
    <rect x="179" y="283" width="32" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="174" y="278" width="7" height="16" rx="2" fill="#FFFFFF"/>
    <rect x="209" y="278" width="7" height="16" rx="2" fill="#FFFFFF"/>

    <!-- titles -->
    <text x="195" y="347" font-size="24" font-weight="800" fill="#3A4149" text-anchor="middle">Sejong Gym Check-in</text>
    <text x="195" y="374" font-size="14" font-weight="500" fill="#8A919B" text-anchor="middle">Sign in with your student account</text>

    <!-- student id field -->
    <text x="44" y="416" font-size="12" font-weight="700" fill="#8A919B" letter-spacing="0.4">STUDENT ID</text>
    <rect x="44" y="428" width="302" height="46" rx="12" fill="#FFFFFF" stroke="#D8DCE3" stroke-width="1.5"/>
    <text x="58" y="458" font-size="15" font-weight="500" fill="#3A4149">20241234</text>

    <!-- password field -->
    <text x="44" y="499" font-size="12" font-weight="700" fill="#8A919B" letter-spacing="0.4">PASSWORD</text>
    <rect x="44" y="511" width="302" height="46" rx="12" fill="#FFFFFF" stroke="#D8DCE3" stroke-width="1.5"/>
    <text x="58" y="541" font-size="15" font-weight="500" fill="#3A4149" letter-spacing="2">••••••••</text>

    <!-- submit button -->
    <rect x="44" y="581" width="302" height="52" rx="12" fill="#9AA1AB"/>
    <text x="195" y="613" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">Sign In</text>


    <!-- home indicator -->
    <rect x="130" y="832" width="130" height="5" rx="2.5" fill="#C9CED6"/>
  </g>
</svg>
